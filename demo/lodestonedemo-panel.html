<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lodestone Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{
  --bg:#E8EBEE; --panel:#F5F6F7; --raised:#FFFFFF; --sunk:#EEF0F2;
  --ink:#161A1F; --ink-2:#48515C; --muted:#6A737E; --line:#D2D7DD;
  --accent:#8A6413; --accent-ink:#FFFFFF; --accent-soft:#F0E5CB;
  --good:#23874C; --warn:#B45F08; --crit:#BF3434;
  --good-soft:#DDF1E4; --warn-soft:#FBE8D3; --crit-soft:#F8DEDE;
  --grid:#E3E7EB;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --pixel:"Pixelify Sans","IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --panel:#161A1F; --raised:#1C2127; --sunk:#14181C;
    --ink:#E5E8EC; --ink-2:#AAB3BD; --muted:#7C8692; --line:#2A3038;
    --accent:#D5A544; --accent-ink:#1A1405; --accent-soft:#3A3019;
    --good:#4CC27D; --warn:#EE9442; --crit:#EE6464;
    --good-soft:#173524; --warn-soft:#3D2814; --crit-soft:#3E1C1C;
    --grid:#252B32;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --panel:#161A1F; --raised:#1C2127; --sunk:#14181C;
  --ink:#E5E8EC; --ink-2:#AAB3BD; --muted:#7C8692; --line:#2A3038;
  --accent:#D5A544; --accent-ink:#1A1405; --accent-soft:#3A3019;
  --good:#4CC27D; --warn:#EE9442; --crit:#EE6464;
  --good-soft:#173524; --warn-soft:#3D2814; --crit-soft:#3E1C1C;
  --grid:#252B32;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--pixel);font-weight:700;font-size:22px;letter-spacing:.02em;padding-inline:6px}
.brand small{display:block;font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.side-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-inline:8px;margin-bottom:6px}
.srv-list,.nav{display:flex;flex-direction:column;gap:2px}
.srv{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;border:0;background:none;text-align:left}
.srv:hover,.nav-btn:hover{background:var(--sunk)}
.srv[aria-pressed="true"]{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.srv .dot{width:8px;height:8px;border-radius:2px;background:var(--muted)}
.srv .dot.on{background:var(--good)} .srv .dot.starting{background:var(--warn)}
.srv .meta{font:11px var(--mono);color:var(--muted)}
.nav-btn{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;border:0;background:none;color:var(--ink-2);text-align:left}
.nav-btn kbd{font:11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding-inline:8px}

main{padding-inline:28px;padding-block:18px 48px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.top h1{font:600 20px/1.2 var(--sans);margin:0;text-wrap:balance}
.addr{display:flex;align-items:center;gap:8px;margin-top:4px;font:12.5px var(--mono);color:var(--ink-2)}
.addr button{border:1px solid var(--line);background:var(--raised);border-radius:4px;font-size:11px;padding:1px 7px;color:var(--ink-2)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.online{background:var(--good-soft);color:var(--good)}
.pill.starting,.pill.stopping{background:var(--warn-soft);color:var(--warn)}
.pill.offline{background:var(--crit-soft);color:var(--crit)}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:6px 13px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:3px 9px;font-size:12px}

.view[hidden]{display:none!important}
.view-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
.view-head h2{font:600 16px var(--sans);margin:0}
.view-head p{margin:0;color:var(--muted);font-size:13px}

/* ---------- overview ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:4px}
.label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .val{font:500 26px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.tile .val small{font-size:14px;color:var(--muted)}
.tile .sub{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.spark{width:84px;height:24px;display:block}
.row{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:12px;margin-top:12px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.card-h h3{font:600 13.5px var(--sans);margin:0}
.card-h span{font-size:12px;color:var(--muted)}
.chart-box{position:relative}
.chart-box svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-110%)}
.tip b{font-family:var(--mono)}
.minimap{width:100%;aspect-ratio:1/1;max-width:100%;border-radius:6px;display:block;image-rendering:pixelated;cursor:pointer;background:#0d0f12}
.meters{display:grid;gap:14px}
.meter .top-line{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.meter .top-line span:last-child{font-family:var(--mono);color:var(--ink-2)}
.bar{height:8px;border-radius:4px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .6s}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:0;font-size:13px}
.feed li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--grid)}
.feed li:first-child{border-top:0}
.feed time{font:12px var(--mono);color:var(--muted)}

/* ---------- map ---------- */
