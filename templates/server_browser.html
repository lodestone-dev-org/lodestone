<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Files</title>
</head>
<body>
    <h1>Server List</h1>
    <ul>
        {% for server in servers %}
            <li><a href="{{ url_for('server_files', server_id=server.id) }}">{{ server.name }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
