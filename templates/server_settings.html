{% extends "base.html" %}

{% block title %}{{ server.name }} Server Settings{% endblock %}

{% block content %}
    <h1>{{ server.name }} Server Settings</h1>

    <form action="{{ url_for('update_server_settings', server_id=server.id) }}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Server Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ server.name }}" required>
        </div>
        <div class="mb-3">
            <label for="memory" class="form-label">Memory (MB)</label>
            <input type="number" class="form-control" id="memory" name="memory" value="{{ server.memory }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update Settings</button>
    </form>
{% endblock %}
